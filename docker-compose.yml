services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: imaquina
      POSTGRES_PASSWORD: imaquina
      POSTGRES_DB: imaquina
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imaquina"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://imaquina:imaquina@db:5432/imaquina
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: ./backend
    command: arq app.workers.worker.WorkerSettings
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://imaquina:imaquina@db:5432/imaquina
      REDIS_URL: redis://redis:6379/0
    volumes: ["./backend:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
